services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tycooninkske
      POSTGRES_USER: tycooninkske
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tycooninkske -d tycooninkske"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: